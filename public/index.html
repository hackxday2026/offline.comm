<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 NRF24 Chat</title>
    <style>
      :root {
        --bg: #0b1120;
        --bg-alt: #111827;
        --surface: rgba(17, 24, 39, 0.88);
        --surface-soft: #172033;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.16);
        --success: #34d399;
        --border: rgba(148, 163, 184, 0.18);
        --input-bg: rgba(15, 23, 42, 0.72);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top,
            rgba(96, 165, 250, 0.18),
            transparent 35%
          ),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
      }

      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 22px 18px 30px;
      }

      .app-layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .sidebar,
      .sidebar-card {
        height: 100%;
      }

      .sidebar {
        position: sticky;
        top: 22px;
      }

      .sidebar-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
        overflow: hidden;
      }

      .sidebar-header {
        padding: 20px 20px 14px;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-header span {
        display: block;
        color: var(--accent);
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .sidebar-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .chat-list {
        display: grid;
      }

      .chat-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .chat-item:last-child {
        border-bottom: 0;
      }

      .chat-item.selected {
        background: rgba(96, 165, 250, 0.12);
      }

      .chat-item:hover {
        background: rgba(148, 163, 184, 0.08);
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
      }

      .avatar.offline {
        background: linear-gradient(135deg, #334155, #1f2937);
        box-shadow: none;
      }

      .chat-details {
        min-width: 0;
        flex: 1;
      }

      .chat-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }

      .chat-name {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
        flex: 0 0 auto;
      }

      .chat-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #64748b;
      }

      .chat-status.online .chat-status-dot {
        background: var(--success);
      }

      .chat-status.offline .chat-status-dot {
        background: #64748b;
      }

      .chat-preview {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .sidebar-footer {
        padding: 14px 20px 18px;
        color: var(--muted);
        font-size: 0.9rem;
        border-top: 1px solid var(--border);
      }

      .hero {
        padding: 18px 20px;
        margin-bottom: 18px;
        background: var(--surface);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(1.9rem, 3vw, 2.4rem);
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .hero,
      .card,
      .modal {
        border: 1px solid var(--border);
        backdrop-filter: blur(16px);
      }

      .card {
        background: var(--surface);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .card-header {
        padding: 20px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .title-block span {
        display: block;
        color: var(--accent);
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .title-block h2 {
        margin: 0;
        font-size: 1.4rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.95rem;
      }

      .status-indicator {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #f59e0b;
      }

      .status-indicator.connected {
        background: var(--success);
      }

      .log-box {
        min-height: 380px;
        max-height: 55vh;
        overflow-y: auto;
        padding: 18px 18px 0;
        display: grid;
        gap: 12px;
        background: linear-gradient(
          180deg,
          rgba(15, 23, 42, 0.35),
          rgba(15, 23, 42, 0.18)
        );
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .message.me {
        align-items: flex-end;
      }

      .message.peer {
        align-items: flex-start;
      }

      .message.system {
        align-items: center;
      }

      .bubble {
        max-width: min(80%, 500px);
        padding: 14px 16px;
        border-radius: 20px;
        line-height: 1.6;
        word-break: break-word;
        border: 1px solid transparent;
      }

      .me .bubble {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border-color: rgba(59, 130, 246, 0.35);
      }

      .peer .bubble {
        background: rgba(30, 41, 59, 0.9);
        color: var(--text);
        border-color: var(--border);
      }

      .system .bubble {
        background: transparent;
        color: var(--muted);
        font-size: 0.95rem;
        border: none;
        box-shadow: none;
      }

      .meta {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .actions {
        padding: 18px 20px 22px;
        display: grid;
        gap: 14px;
      }

      .input-row {
        display: grid;
        gap: 12px;
      }

      .input-row .field-row {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr auto;
      }

      .input-row input {
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border);
        padding: 13px 14px;
        font-size: 1rem;
        color: var(--text);
        background: var(--input-bg);
      }

      .input-row input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      }

      .input-row button,
      .quick-button {
        border: none;
        border-radius: 16px;
        padding: 13px 18px;
        color: white;
        background: var(--accent);
        cursor: pointer;
        font-size: 0.98rem;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease;
      }

      .input-row button:hover,
      .quick-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 22px rgba(37, 99, 235, 0.16);
      }

      .quick-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .quick-footer p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 10;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: 100%;
        max-width: 420px;
        background: rgba(15, 23, 42, 0.96);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
      }

      .modal h3 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      .modal button {
        width: 100%;
        margin-bottom: 10px;
        background: rgba(30, 41, 59, 0.95);
        color: var(--text);
        border-radius: 14px;
        border: 1px solid var(--border);
      }

      .modal button:last-child {
        margin-bottom: 0;
      }

      .modal button.primary {
        background: var(--accent);
        color: white;
        border-color: transparent;
      }

      .close-button {
        display: block;
        margin-top: 14px;
        width: 100%;
        background: transparent;
        color: var(--accent);
      }

      @media (max-width: 560px) {
        .hero,
        .card {
          border-radius: 22px;
        }

        .app-layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .card-header,
        .actions {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="app-layout">
        <aside class="sidebar">
          <section class="sidebar-card">
            <div class="sidebar-header">
              <span>Chats</span>
              <h2>Team inbox</h2>
            </div>

            <div class="chat-list">
              <button class="chat-item selected" type="button">
                <div class="avatar">M</div>
                <div class="chat-details">
                  <div class="chat-topline">
                    <div class="chat-name">Riman</div>
                    <div class="chat-status online">
                      <span class="chat-status-dot"></span>
                      <span>online</span>
                    </div>
                  </div>
                  <p class="chat-preview">Active conversation</p>
                </div>
              </button>

              <button class="chat-item" type="button">
                <div class="avatar offline">S</div>
                <div class="chat-details">
                  <div class="chat-topline">
                    <div class="chat-name">Sufal</div>
                    <div class="chat-status offline">
                      <span class="chat-status-dot"></span>
                      <span>offline</span>
                    </div>
                  </div>
                  <p class="chat-preview">Waiting for connection</p>
                </div>
              </button>

              <button class="chat-item" type="button">
                <div class="avatar offline">S</div>
                <div class="chat-details">
                  <div class="chat-topline">
                    <div class="chat-name">Support Desk</div>
                    <div class="chat-status offline">
                      <span class="chat-status-dot"></span>
                      <span>offline</span>
                    </div>
                  </div>
                  <p class="chat-preview">Waiting for connection</p>
                </div>
              </button>

              <button class="chat-item" type="button">
                <div class="avatar offline">Y</div>
                <div class="chat-details">
                  <div class="chat-topline">
                    <div class="chat-name">Yushant</div>
                    <div class="chat-status offline">
                      <span class="chat-status-dot"></span>
                      <span>offline</span>
                    </div>
                  </div>
                  <p class="chat-preview">Waiting for connection</p>
                </div>
              </button>
            </div>

            <div class="sidebar-footer">Riman is selected.</div>
          </section>
        </aside>

        <div>
          <section class="hero">
            <div class="title-block">
              <span>offline.comm</span>
              <h1>Quick messages for field teams</h1>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div>
                <span>Device bridge</span>
                <h2>Chat with Riman</h2>
              </div>
              <div class="status-pill" id="status-pill">
                <span class="status-indicator" id="status-dot"></span>
                <span id="status">connecting...</span>
              </div>
            </div>

            <div class="log-box" id="log"></div>

            <div class="actions">
              <div class="input-row">
                <div class="field-row">
                  <input
                    id="msg"
                    type="text"
                    placeholder="Type a message..."
                    autocomplete="off"
                  />
                  <button id="sendButton" onclick="sendMsg()">Send</button>
                </div>
                <button class="quick-button" onclick="toggleQuickModal()">
                  Quick messages
                </button>
              </div>
              <div class="quick-footer">
                <p>
                  Tap a quick message and the popup will let you send it
                  instantly.
                </p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <div class="modal-backdrop" id="quickModal">
      <div class="modal">
        <h3>Choose a quick message</h3>
        <button onclick="sendQuick('Need help at my location')">
          Need help at my location
        </button>
        <button onclick="sendQuick('Requesting backup now')">
          Requesting backup now
        </button>
        <button onclick="sendQuick('Check in with the team')">
          Check in with the team
        </button>
        <button onclick="sendQuick('Equipment issue, please assist')">
          Equipment issue, please assist
        </button>
        <button class="primary" onclick="sendQuick('Help me please')">
          Help me please
        </button>
        <button class="close-button" onclick="toggleQuickModal()">Close</button>
      </div>
    </div>

    <script>
      const log = document.getElementById("log");
      const input = document.getElementById("msg");
      const statusEl = document.getElementById("status");
      const statusDot = document.getElementById("status-dot");
      const sendButton = document.getElementById("sendButton");
      let ws;
      let unread = 0;
      let windowFocused = true;
      const pendingEchoes = [];

      function setStatus(text, connected = false) {
        statusEl.textContent = text;
        statusDot.classList.toggle("connected", connected);
      }

      function connect() {
        ws = new WebSocket("ws://" + location.host);

        ws.onopen = () => {
          setStatus("connected", true);
          appendSystem("Connected to the device. Ready to chat.");
        };

        ws.onclose = () => {
          setStatus("disconnected - retrying...", false);
          appendSystem("Connection lost. Reconnecting...");
          setTimeout(connect, 1500);
        };

        ws.onerror = () => {
          if (ws.readyState !== WebSocket.OPEN) {
            ws.close();
          }
        };

        ws.onmessage = (event) => {
          const item = JSON.parse(event.data);
          if (item.sender === "me" && consumePendingEcho(item.text)) {
            return;
          }
          appendMessage(item.sender, item.text);
        };
      }

      function appendMessage(sender, text) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        const meta = document.createElement("div");
        meta.className = "meta";
        const tag = document.createElement("span");
        tag.textContent =
          sender === "me" ? "You" : sender === "peer" ? "Device" : "System";
        meta.appendChild(tag);

        if (sender !== "system") {
          const time = document.createElement("span");
          time.textContent = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
          meta.appendChild(time);
        }

        wrapper.appendChild(bubble);
        wrapper.appendChild(meta);
        log.appendChild(wrapper);
        log.scrollTop = log.scrollHeight;

        if (!windowFocused && sender !== "me") {
          unread += 1;
          document.title = `(${unread}) NRF24 Chat`;
        }
      }

      function appendSystem(text) {
        appendMessage("system", text);
      }

      function consumePendingEcho(text) {
        const index = pendingEchoes.indexOf(text);
        if (index === -1) {
          return false;
        }

        pendingEchoes.splice(index, 1);
        return true;
      }

      function sendMsg() {
        const text = input.value.trim();
        if (!text) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          appendSystem("Unable to send: device is disconnected.");
          return;
        }

        pendingEchoes.push(text);
        ws.send(JSON.stringify({ text }));
        input.value = "";
        appendMessage("me", text);
      }

      function sendQuick(text) {
        input.value = text;
        toggleQuickModal(false);
        sendMsg();
      }

      function toggleQuickModal(show) {
        const modal = document.getElementById("quickModal");
        const isOpen =
          show !== undefined ? show : !modal.classList.contains("open");
        modal.classList.toggle("open", isOpen);
      }

      document
        .getElementById("quickModal")
        .addEventListener("click", (event) => {
          if (event.target.id === "quickModal") {
            toggleQuickModal(false);
          }
        });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMsg();
        }
      });

      window.addEventListener("focus", () => {
        windowFocused = true;
        unread = 0;
        document.title = "ESP32 NRF24 Chat";
      });

      window.addEventListener("blur", () => {
        windowFocused = false;
      });

      connect();
    </script>
  </body>
</html>
